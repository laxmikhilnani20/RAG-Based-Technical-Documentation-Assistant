# ============================================================
# Docker Compose — RAG Technical Documentation Assistant
# Use for LOCAL DEVELOPMENT only
# For production: deploy to Hugging Face Spaces via Dockerfile
# ============================================================
# Commands:
#   Start:   docker compose up --build
#   Stop:    docker compose down
#   Logs:    docker compose logs -f
# ============================================================

version: "3.11"

services:

  # ------------------------------------------------------------
  # Main Application — FastAPI + LangGraph RAG Pipeline
  # ------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_doc_assistant

    # Override the port to 8000 for local development
    # (HF Spaces uses 7860, but locally 8000 is cleaner)
    ports:
      - "8000:7860"

    # Load environment variables from your local .env file
    env_file:
      - .env

    # ------------------------------------------------------------
    # Volumes — persist ChromaDB data between container restarts
    # Without this, your vector store resets every time!
    # ------------------------------------------------------------
    volumes:
      - chroma_data:/app/chroma_db   # Persistent vector store
      - ./docs_corpus:/app/docs_corpus  # Source documents

    # Restart automatically if the container crashes
    restart: unless-stopped

    # Health check — ensures the app is actually running
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# ------------------------------------------------------------
# Named Volumes — managed by Docker (persists on disk)
# ------------------------------------------------------------
volumes:
  chroma_data:
    driver: local
